'use strict';
const D={"regions":[{"region":"Norte","responses":15,"total":22},{"region":"Nordeste","responses":35,"total":37},{"region":"Centro-Oeste","responses":17,"total":17},{"region":"Sudeste","responses":22,"total":22},{"region":"Sul","responses":20,"total":21}],"metrics":{"units":119,"responses":109,"cases":5,"practices":6,"recommendations":11,"offer":72,"regular_use":95,"adequacy":[24,78,7],"maintenance":[9,85,15],"research_works":679,"research_authors":337},"themes":[{"slug":"formacao","title":"Oferta de cursos","symbol":"▤","teaser":"A formação agrícola assume dimensões diferentes entre as unidades.","detail":"Em 2025, Recursos Naturais foi o eixo de maior participação individual em 72 das 119 unidades. Esse resultado não significa que as demais unidades deixem de oferecer formação agrícola."},{"slug":"estudantes","title":"Permanência e conclusão","symbol":"◎","teaser":"Condições de acesso e apoio ao estudante importam para a continuidade dos estudos.","detail":"Os percursos estudantis diferem entre cursos e modalidades. Alimentação, transporte, moradia e assistência podem facilitar a participação, mas a existência do apoio não comprova, isoladamente, seu alcance ou efeito."},{"slug":"infraestrutura","title":"Infraestrutura agrícola","symbol":"▦","teaser":"Grande parte dos ambientes é utilizada regularmente, embora a adequação seja parcial.","detail":"Entre 109 unidades participantes do levantamento, 95 relataram uso regular dos ambientes. Em perguntas distintas, 78 avaliaram que as instalações atendem apenas parcialmente às necessidades de ensino e 85 indicaram atendimento parcial quanto à equipe ou rotina de manutenção."},{"slug":"territorio","title":"Território e contexto","symbol":"◉","teaser":"As condições locais ajudam a explicar desafios de funcionamento e formação.","detail":"Disponibilidade de água, localização, transporte, atividades produtivas e relações com a comunidade afetam as condições de ensino e extensão. Essas associações não demonstram, sozinhas, relações de causa e efeito."},{"slug":"pesquisa","title":"Pesquisa e extensão","symbol":"✧","teaser":"A produção de conhecimento e as parcerias variam entre as unidades.","detail":"Em um grupo de 15 unidades examinadas em maior profundidade, foram identificadas 679 obras científicas e 337 autores confirmados entre 2021 e 2025. Esses resultados dizem respeito apenas a esse grupo, não a toda a Rede Federal."},{"slug":"gestao","title":"Gestão e financiamento","symbol":"◇","teaser":"A manutenção e o uso pedagógico dependem de decisões de gestão e de recursos.","detail":"A avaliação diferencia recursos distribuídos, despesas efetivamente executadas e necessidades dos espaços agrícolas. A comparação entre unidades exige cautela, pois suas estruturas e responsabilidades operacionais não são idênticas."}],"cases":[{"slug":"padrao","title":"Três unidades, diferentes trajetórias","label":"Posse, Bagé e Colorado do Oeste","region":"Centro-Oeste, Sul e Norte","summary":"Comparação de três unidades com características acadêmicas semelhantes, mas condições de funcionamento e trajetórias distintas.","question":"O que muda quando contextos diferentes apresentam perfil acadêmico semelhante?","takeaway":"A semelhança em alguns indicadores não elimina diferenças de oferta, apoio aos estudantes e organização das atividades.","caution":"Os contrastes mostram situações institucionais, mas não identificam, isoladamente, a causa dos resultados."},{"slug":"excecao","title":"Um perfil institucional singular","label":"São Luís–Maracanã","region":"Nordeste","summary":"Exame de uma unidade com grande diversidade de cursos e trajetórias educacionais.","question":"Como a composição da oferta influencia a leitura dos resultados?","takeaway":"A observação por curso e modalidade ajuda a evitar interpretações excessivamente gerais dos números de uma unidade.","caution":"As informações não permitem acompanhar individualmente cada estudante nem atribuir resultados a experiências específicas."},{"slug":"recorte","title":"Formação agrícola no semiárido","label":"Apodi","region":"Nordeste","summary":"Análise de uma Fazenda-Escola e de experiências de formação e extensão ligadas à agricultura familiar.","question":"Como água, transporte e supervisão técnica influenciam a formação prática?","takeaway":"O uso dos ambientes produtivos depende de condições locais, logística e acompanhamento pedagógico.","caution":"Atividades e participações documentadas não comprovam, por si, impactos ou aprendizagem individual."},{"slug":"potencial","title":"Escola-Fazenda e organização da produção","label":"Muzambinho","region":"Sudeste","summary":"Experiências que aproximam formação prática, produção e organização institucional.","question":"Quais elementos podem inspirar outras unidades?","takeaway":"Procedimentos claros, acompanhamento pedagógico e organização dos fluxos produtivos podem orientar adaptações.","caution":"A existência dessas práticas não comprova sustentabilidade financeira nem autoriza sua reprodução automática."},{"slug":"desafio","title":"Desafios de manutenção e permanência","label":"Teixeira de Freitas","region":"Nordeste","summary":"Análise conjunta da infraestrutura, das condições de funcionamento e dos percursos estudantis.","question":"Quais condições precisam ser fortalecidas para melhorar o funcionamento?","takeaway":"O estudo destaca a importância de conhecer a condição atual dos espaços, planejar manutenção e acompanhar trajetórias.","caution":"Registros históricos não devem ser tratados como comprovação da situação atual de cada instalação."}],"practices":[{"slug":"escola-fazenda","title":"Ensino integrado à Escola-Fazenda","place":"Muzambinho","description":"Integra atividades de formação prática, produção e organização de diferentes setores agrícolas.","attention":"Sua adaptação exige procedimentos, pessoal, supervisão e regras claras para destinação da produção."},{"slug":"cafe-graos","title":"Experimentação em café e grãos","place":"Muzambinho","description":"Articula ambientes experimentais, parceiros tecnológicos e oportunidades de aprendizagem.","attention":"Depende de custeio, acompanhamento técnico e definição dos termos de parceria."},{"slug":"semiarido","title":"Fazenda-Escola e agricultura familiar","place":"Apodi","description":"Aproxima a formação dos desafios produtivos do semiárido e da atuação extensionista.","attention":"Requer atenção à disponibilidade hídrica, deslocamentos e continuidade das ações."},{"slug":"pesquisa-cafe","title":"Pesquisa aplicada à agroindústria do café","place":"Machado","description":"Conecta demandas tecnológicas de empresas a projetos de pesquisa aplicada.","attention":"Os resultados dependem de supervisão, financiamento e participação formativa efetiva."},{"slug":"intercambio","title":"Intercâmbio técnico supervisionado","place":"Inconfidentes","description":"Possibilita compartilhar ambientes, conhecimentos e experiências com outras instituições.","attention":"É necessário prever deslocamento, segurança e objetivos pedagógicos definidos."},{"slug":"extensao","title":"Projetos de extensão com o território","place":"Salinas","description":"Organiza iniciativas em parceria com comunidades e organizações locais.","attention":"A continuidade precisa ser acompanhada; número de ações não equivale automaticamente a impacto."}],"proposals":[{"slug":"ambientes","group":"Infraestrutura","title":"Conhecer o funcionamento de cada ambiente agrícola","action":"Criar um levantamento periódico sobre uso, capacidade, acessibilidade e condições de funcionamento dos espaços.","purpose":"Ajudar a distinguir o que existe do que pode ser utilizado de forma efetiva nas atividades educacionais."},{"slug":"manutencao","group":"Infraestrutura","title":"Planejar manutenção a partir dos riscos","action":"Identificar os ativos prioritários e organizar manutenção preventiva e corretiva de acordo com segurança e importância para o ensino.","purpose":"Reduzir interrupções e proteger a continuidade das ","title":"Acompanhar a execução de projetos e parcerias","action":"Registrar objetivos, atividades, participantes, recursos e entregas dos projetos de pesquisa aplicada e extensão.","purpose":"Favorecer a continuidade e a avaliação dos resultados das iniciativas."},{"slug":"producao","group":"Gestão","title":"Organizar regras para a produção agrícola institucional","action":"Estabelecer procedimentos para produção, armazenamento, destinação, comercialização e utilização de recursos, quando aplicável.","purpose":"Dar segurança às atividades pedagógicas e produtivas, respeitando os instrumentos legais pertinentes."},{"slug":"compartilhamento","group":"Pesquisa e extensão","title":"Compartilhar experiências entre unidades","action":"Promover intercâmbio de práticas com indicação de condições necessárias, limitações e acompanhamento das adaptações.","purpose":"Difundir aprendizados sem pressupor que uma experiência funcione da mesma forma em contextos diferentes."}]};
const nav=[['inicio','Início'],['panorama','Panorama nacional'],['resultados','O que encontramos'],['casos','Estudos de caso'],['praticas','Boas práticas'],['propostas','Propostas de melhoria'],['sobre','Sobre a avaliação'],['contato','Contato']];
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const href=x=>'#/'+x;
const contact='mailto:rangel.pacheco@iffarroupilha.edu.br?subject='+encodeURIComponent('Contato sobre a Avaliação Temática RFEPCT');
const heading=(tag,title,lead)=>`<header class="page-title"><span class="kicker">${esc(tag)}</span><h1>${esc(title)}</h1>${lead?`<p class="lead">${esc(lead)}</p>`:''}</header>`;
const note=`<p class="announcement">As conclusões são interpretações técnicas do estudo. As medidas sugeridas ainda dependem de avaliação e decisão das instâncias competentes.</p>`;
const sec=(title,desc='')=>`<div class="section-head"><div><h2>${esc(title)}</h2>${desc?`<p>${esc(desc)}</p>`:''}</div></div>`;
const metric=(n,label)=>`<div class="metric"><strong>${esc(n)}</strong><span>${esc(label)}</span></div>`;
function home(){return `<section class="hero"><span class="kicker">Avaliação Temática da Rede Federal</span><h1>O que descobrimos sobre as <em>unidades agrícolas</em>?</h1><p>Um panorama claro sobre formação, infraestrutura e desafios das unidades agrícolas da Rede Federal — e caminhos para aprimorar seu funcionamento.</p><div class="actions"><a class="btn fill" href="#/panorama">Conhecer os resultados →</a><a class="btn outline" href="#/propostas">Ver propostas de melhoria</a></div></section>
<div class="metric-grid">${metric('119','unidades consideradas na avaliação')}${metric('109','unidades participantes do levantamento de infraestrutura')}${metric('5','estudos de caso')}${metric('11','propostas de melhoria')}</div>
<section class="section">${sec('Três mensagens principais','Uma primeira leitura, sem necessidade de conhecer termos técnicos.')}
<div class="grid">
<article class="card"><div class="icon">▦</div><h3>Espaços utilizados, mas nem sempre suficientes</h3><p>O uso dos ambientes agrícolas é frequente. A adequação e as condições de manutenção, porém, ainda precisam de atenção.</p><a href="#/panorama">Entender os números →</a></article>
<article class="card"><div class="icon">◎</div><h3>Realidades institucionais diferentes</h3><p>As unidades atuam em territórios e condições de oferta distintas. Comparações simples podem ocultar diferenças importantes.</p><a href="#/casos">Conhecer os casos →</a></article>
<article class="card"><div class="icon">◇</div><h3>Planejamento e gestão fazem diferença</h3><p>Manutenção, acesso às práticas e financiamento aparecem como temas importantes para orientar melhorias.</p><a href="#/propostas">Ver caminhos propostos →</a></article></div></section>
<section class="section"><div class="soft"><h2>Uma avaliação para apoiar decisões</h2><p>O Observatório apresenta resultados e recomendações em linguagem acessível. Para aprofundar alguma questão, o responsável técnico está disponível por e-mail.</p><div class="actions"><a class="btn deep" href="#/sobre">Conheça a avaliação →</a><a class="btn light" href="#/contato">Fale com o responsável técnico</a></div></div></section>${note}`;}
function panorama(){const c=D.metrics;const bar=(title,arr,n)=>`<div class="card"><h3>${esc(title)}</h3><div class="segment">${arr.map((v,i)=>`<div style="width:${(v/n*100).toFixed(3)}%" title="${v}"></div>`).join('')}</div><div class="split">${arr.map((v,i)=>`<div class="part"><strong>${v}</strong><small>${['Atende','Atende parcialmente','Não atende'][i]}</small></div>`).join('')}</div></div>`;return `${heading('Panorama nacional','A avaliação em números','Estes indicadores ajudam a compreender a abrangência do estudo e as condições relatadas pelas unidades. Cada pergunta descreve um aspecto diferente.')}
<div class="metric-grid">${metric('119','unidades do universo avaliado')}${metric('109','participantes do levantamento de infraestrutura')}${metric('72','unidades com Recursos Naturais como maior eixo de oferta em 2025')}${metric('15','unidades examinadas em maior profundidade na produção científica')}</div>
<section class="section">${sec('Participação no levantamento por região','A proporção varia conforme a região; os números não representam uma classificação de qualidade.')}
<div class="card"><div class="bar-list">${D.regions.map(r=>`<div class="bar-item"><span class="label">${esc(r.region)}</span><div class="track" aria-label="${esc(r.region)}: ${r.responses} de ${r.total}"><div class="fillbar" style="width:${(100*r.responses/r.total).toFixed(1)}%"></div></div><span>${r.responses} de ${r.total}</span></div>`).join('')}</div></div></section>
<section class="section">${sec('Como estão os espaços agrícolas?','Resultados do levantamento de 2026, com 109 unidades participantes.')}
<div class="card"><h3>Uso regular dos ambientes</h3><p><strong style="font-size:31px;color:#0b7664">95 de 109</strong> unidades relataram uso regular dos espaços agrícolas.</p><div class="track"><div class="fillbar" style="width:${(c.regular_use/c.responses*100).toFixed(1)}%"></div></div><p class="subtle">Uso regular não significa, necessariamente, que os espaços sejam suficientes ou estejam em boas condições.</p></div><div class="grid two" style="margin-top:16px">${bar('Adequação dos espaços às atividades de ensino',c.adequacy,c.responses)}${bar('Equipe ou rotina de manutenção',c.maintenance,c.responses)}</div></section>
<section class="section">${sec('Formação e produção científica','São informações sobre aspectos diferentes da avaliação; não devem ser somadas.')}
<div class="grid two"><div class="card"><span class="eyebrow">Oferta de cursos · 2025</span><h3>Recursos Naturais em destaque</h3><p>Em <strong>72 das 119</strong> unidades, Recursos Naturais foi o eixo tecnológico com maior participação individual.</p></div><div class="card"><span class="eyebrow">Pesquisa · 2021 a 2025</span><h3>Produção científica examinada</h3><p>Em <strong>15 unidades</strong>, foram identificadas <strong>679 obras científicas</strong> e <strong>337 autores confirmados</strong>.</p><p class="subtle">Esses números não representam a produção de toda a Rede Federal.</p></div></div></section>${note}`;}
function resultados(){return `${heading('Principais resultados','O que a avaliação encontrou?','Seis temas ajudam a compreender as oportunidades e os desafios das unidades agrícolas. Abra “Saiba mais” somente quando desejar aprofundar o assunto.')}
<div class="grid two">${D.themes.map(t=>`<article class="card"><div class="icon" aria-hidden="true">${esc(t.symbol)}</div><h3>${esc(t.title)}</h3><p>${esc(t.teaser)}</p><details class="details"><summary>Saiba mais</summary><p>${esc(t.detail)}</p></details></article>`).join('')}</div>${note}`;}
function casos(){return `${heading('Estudos de caso','Cinco maneiras de compreender a Rede Federal','Os estudos mostram experiências e desafios em situações institucionais diferentes. Não são um ranking das unidades.')}
<div class="thin-grid">${D.cases.map(c=>`<article class="story"><div class="location">${esc(c.label)} · ${esc(c.region)}</div><h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p><p class="bottom"><a href="${href('casos/'+c.slug)}">Conhecer este estudo →</a></p></article>`).join('')}</div>${note}`;}
function caso(slug){const c=D.cases.find(x=>x.slug===slug);if(!c)return missing();return `<div class="detail"><a class="detail-back" href="#/casos">← Voltar aos estudos de caso</a>${heading('Estudo de caso',c.title,c.label)}<div class="card"><h2>O que foi investigado?</h2><p>${esc(c.summary)}</p><h3 style="margin-top:22px">Pergunta principal</h3><p>${esc(c.question)}</p></div><div class="card"><h2>O que podemos aprender?</h2><p>${esc(c.takeaway)}</p></div><div class="callout"><strong>Como interpretar</strong>${esc(c.caution)}</div><a class="btn deep" href="#/casos">Ver todos os estudos</a></div>`;}
function praticas(){return `${heading('Experiências e boas práticas','Iniciativas que merecem atenção','Conheça seis experiências de formação, pesquisa e extensão. Cada uma depende de condições próprias para funcionar bem.')}
<div class="thin-grid">${D.practices.map(p=>`<article class="story"><div class="location">${esc(p.place)}</div><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><details class="details"><summary>O que considerar antes de adaptar?</summary><p>${esc(p.attention)}</p></details></article>`).join('')}</div>${note}`;}
let group='Todas';
function propostas(){const groups=['Todas',...new Set(D.proposals.map(p=>p.group))];const list=D.proposals.filter(p=>group==='Todas'||p.group===group);return `${heading('Desafios e propostas','O que pode ser melhorado?','Onze medidas são sugeridas para fortalecer as unidades agrícolas. São propostas técnicas, não decisões já adotadas.')}
<div class="filters"><label>Filtrar por assunto<select id="group-filter">${groups.map(g=>`<option value="${esc(g)}" ${g===group?'selected':''}>${esc(g)}</option>`).join('')}</select></label></div><div class="grid two">${list.map(p=>`<article class="card"><span class="eyebrow">${esc(p.group)}</span><h3>${esc(p.title)}</h3><p>${esc(p.action)}</p><a href="${href('propostas/'+p.slug)}">Por que essa medida importa? →</a></article>`).join('')}</div>${note}`;}
function proposta(slug){const p=D.proposals.find(x=>x.slug===slug);if(!p)return missing();return `<div class="detail"><a class="detail-back" href="#/propostas">← Voltar às propostas</a>${heading(p.group,p.title,'Uma proposta apresentada na Avaliação Temática, sujeita à análise das instâncias competentes.')}
<div class="card"><h2>O que se propõe?</h2><p>${esc(p.action)}</p></div><div class="soft" style="margin-top:16px"><h2>Por que isso importa?</h2><p>${esc(p.purpose)}</p></div>${note}<a class="btn deep" href="#/propostas">Ver todas as propostas</a></div>`;}
function sobre(){return `${heading('Sobre a avaliação','Conheça o propósito do estudo','A Avaliação Temática examina a oferta formativa, as condições de infraestrutura e as relações com o desenvolvimento territorial das unidades agrícolas da Rede Federal.')}
<div class="grid two"><article class="card"><h3>O que foi considerado?</h3><p>Um conjunto nacional de 119 unidades, informações educacionais de 2021 a 2025, um levantamento de infraestrutura realizado em 2026 e cinco estudos de caso.</p></article><article class="card"><h3>Para que serve?</h3><p>Identificar desafios e experiências relevantes para subsidiar o planejamento, a gestão e a formulação de medidas de aperfeiçoamento.</p></article><article class="card"><h3>Como interpretar?</h3><p>Diferenças entre unidades não devem ser tratadas como classificação de mérito. As características locais precisam ser consideradas em cada interpretação.</p></article><article class="card"><h3>E as recomendações?</h3><p>O Observatório apresenta propostas técnicas. Sua adoção depende de análise administrativa, normativa e orçamentária pelas instâncias responsáveis.</p></article></div>
<section class="section"><div class="soft"><span class="kicker">Responsabilidade técnica</span><h2 style="margin-top:12px">Rangel Pacheco</h2><p>Responsável técnico pela Avaliação Temática das unidades com tipologia agrícola da Rede Federal.</p><a class="btn deep" href="#/contato">Entre em contato →</a></div></section>`;}
function contato(){return `${heading('Contato','Fale com o responsável técnico','Dúvidas sobre os resultados, questões de interpretação ou sugestões podem ser encaminhadas diretamente por e-mail.')}
<div class="contact-panel"><span class="kicker" style="color:#b5f6d7">Responsável técnico pela Avaliação Temática</span><h2 style="margin-top:16px">Rangel Pacheco</h2><p>Para esclarecimentos sobre o Observatório e a Avaliação Temática das unidades agrícolas da Rede Federal:</p><a class="email" href="${contact}">rangel.pacheco@iffarroupilha.edu.br</a><a class="btn fill" href="${contact}">Escrever e-mail ↗</a></div><p class="contact-note">Ao selecionar “Escrever e-mail”, seu aplicativo de correio eletrônico será aberto. O Observatório não coleta mensagens nem informações pessoais em formulários.</p>`;}
function missing(){return `${heading('Página indisponível','Esta página não foi encontrada','Escolha outra área do Observatório no menu principal.')}<a class="btn deep" href="#/inicio">Voltar ao início</a>`;}
function route(){let p='inicio';try{p=decodeURIComponent(location.hash.replace(/^#\/?/,'').replace(/^\//,'')||'inicio')}catch(_e){}if(!p)p='inicio';const [head,detail]=p.split('/');let fn={inicio:home,panorama:panorama,resultados:resultados,casos:()=>detail?caso(detail):casos(),praticas:praticas,propostas:()=>detail?proposta(detail):propostas(),sobre:sobre,contato:contato}[head]||missing;$('#main-content').innerHTML=fn();const title={inicio:'Início',panorama:'Panorama nacional',resultados:'O que encontramos',casos:'Estudos de caso',praticas:'Boas práticas',propostas:'Propostas de melhoria',sobre:'Sobre a avaliação',contato:'Contato'}[head]||'Observatório';$('#breadcrumb').textContent=title;document.title=title+' · Observatório RFEPCT';document.querySelectorAll('.nav a').forEach(a=>{if(a.dataset.route===head)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});$('#sidebar').classList.remove('open');$('#mobile-scrim').classList.remove('show');$('#menu-btn').setAttribute('aria-expanded','false');window.scrollTo(0,0);}
$('#nav').innerHTML=nav.map(([route,label],i)=>`<a href="${href(route)}" data-route="${route}"><span class="nav-num">${String(i+1).padStart(2,'0')}</span>${esc(label)}</a>`).join('');
$('#menu-btn').addEventListener('click',()=>{const open=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',open);$('#mobile-scrim').classList.toggle('show',open);$('#menu-btn').setAttribute('aria-expanded',String(open));});$('#mobile-scrim').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#mobile-scrim').classList.remove('show');$('#menu-btn').setAttribute('aria-expanded','false');});document.addEventListener('change',e=>{if(e.target.id==='group-filter'){group=e.target.value;route();}});document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();$('#main-content').focus();});window.addEventListener('hashchange',route);route();
})();
</script></body></html>
